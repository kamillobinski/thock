name: Thock Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    name: Build, Release & Bump Homebrew
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Build Archive
        run: |
          mkdir -p build
          xcodebuild -scheme Thock -configuration Release \
            -arch x86_64 -arch arm64 \
            -archivePath build/Thock.xcarchive archive \
            -clonedSourcePackagesDirPath build/SourcePackages \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          cp -R build/Thock.xcarchive/Products/Applications/Thock.app build/Thock.app

      - name: Add CLI
        run: cp cli/thock-cli build/thock-cli

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          trap 'rm -f "$CERT_PATH"' EXIT
          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | awk '{print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "Error: Developer ID Application identity not found in keychain!" >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> $GITHUB_ENV

      - name: Sign the app
        run: |
          SPARKLE="build/Thock.app/Contents/Frameworks/Sparkle.framework"
          codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" "$SPARKLE/Versions/B/XPCServices/Installer.xpc"
          codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" --preserve-metadata=entitlements "$SPARKLE/Versions/B/XPCServices/Downloader.xpc"
          codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" "$SPARKLE/Versions/B/Autoupdate"
          codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" "$SPARKLE/Versions/B/Updater.app"
          codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" "$SPARKLE"

          codesign --force --options runtime --timestamp \
            --entitlements Thock/Thock.entitlements \
            --sign "$SIGN_IDENTITY" build/Thock.app
          codesign --verify --strict --verbose=2 build/Thock.app

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Notarize and staple
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$KEY_PATH"' EXIT
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"

          ditto -c -k --keepParent build/Thock.app build/Thock-notarize.zip

          xcrun notarytool submit build/Thock-notarize.zip \
            --key "$KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m --output-format json > notarize.json || true
          cat notarize.json

          STATUS=$(plutil -extract status raw notarize.json 2>/dev/null || echo "unknown")
          if [ "$STATUS" != "Accepted" ]; then
            SUBMISSION_ID=$(plutil -extract id raw notarize.json 2>/dev/null || true)
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --key "$KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
            fi
            echo "Error: notarization status is '$STATUS'" >&2
            exit 1
          fi

          xcrun stapler staple build/Thock.app
          rm -f build/Thock-notarize.zip

      - name: Verify Gatekeeper acceptance
        run: |
          xcrun stapler validate build/Thock.app
          spctl -a -vvv -t exec build/Thock.app 2>&1 | tee spctl.txt
          grep -q "source=Notarized Developer ID" spctl.txt

      - name: Zip with version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cd build
          ZIP_NAME="Thock-$VERSION.zip"
          zip -ry "$ZIP_NAME" Thock.app thock-cli
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Get SHA256
        id: sha
        run: |
          HASH=$(shasum -a 256 "build/$ZIP_NAME" | awk '{ print $1 }')
          echo "sha=$HASH" >> $GITHUB_OUTPUT

      - name: Generate Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          PLIST=build/Thock.app/Contents/Info.plist
          SHORT_VERSION=$(plutil -extract CFBundleShortVersionString raw "$PLIST")
          BUILD_VERSION=$(plutil -extract CFBundleVersion raw "$PLIST")
          MIN_SYSTEM_VERSION=$(plutil -extract LSMinimumSystemVersion raw "$PLIST")
          if [ "$SHORT_VERSION" != "$VERSION" ]; then
            echo "Error: tag '$VERSION' does not match app version '$SHORT_VERSION'" >&2
            exit 1
          fi

          NOTES_PATH="docs/releases/$VERSION.md"
          if [ ! -f "$NOTES_PATH" ]; then
            echo "Error: release notes not found at $NOTES_PATH" >&2
            exit 1
          fi
          RELEASE_NOTES=$(cat "$NOTES_PATH")

          SIGNATURE_ATTRS=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | \
            build/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - "build/$ZIP_NAME")
          if ! echo "$SIGNATURE_ATTRS" | grep -q 'sparkle:edSignature='; then
            echo "Error: sign_update did not return a signature" >&2
            exit 1
          fi

          PUB_DATE=$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/$VERSION/$ZIP_NAME"

          cat > build/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Thock</title>
              <item>
                <title>$VERSION</title>
                <pubDate>$PUB_DATE</pubDate>
                <sparkle:version>$BUILD_VERSION</sparkle:version>
                <sparkle:shortVersionString>$SHORT_VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>$MIN_SYSTEM_VERSION</sparkle:minimumSystemVersion>
                <sparkle:fullReleaseNotesLink>https://github.com/${{ github.repository }}/releases</sparkle:fullReleaseNotesLink>
                <description sparkle:format="markdown"><![CDATA[
          $RELEASE_NOTES
                ]]></description>
                <enclosure url="$DOWNLOAD_URL" $SIGNATURE_ATTRS type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          EOF
          xmllint --noout build/appcast.xml
          cat build/appcast.xml

      - name: Upload release artifact
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/${{ env.ZIP_NAME }}
            build/appcast.xml
          body_path: docs/releases/${{ github.ref_name }}.md
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          git config --global user.email "release@thockapp.com"
          git config --global user.name "Thock Release"

          gh auth setup-git
          git clone https://github.com/kamillobinski/homebrew-thock.git
          cd homebrew-thock
          git checkout -b "bump-$VERSION"

          sed -i '' "s|version \".*\"|version \"$VERSION\"|" Casks/thock.rb
          sed -i '' "s|sha256 \".*\"|sha256 \"$SHA\"|" Casks/thock.rb

          git add Casks/thock.rb
          git commit -m "chore: bump cask to $VERSION"
          git push origin "bump-$VERSION"
          gh pr create --title "chore: bump cask to $VERSION" --body "Automated Thock cask version bump." --head "bump-$VERSION"
